name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-build.txt
      - run: python build_exe.py
      - name: Build proper Windows installer and uninstaller
        run: choco install innosetup --yes --no-progress && iscc installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: WinWall-Windows
          path: installer-output/*.exe
      - name: Add installer to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer-output/*.exe
